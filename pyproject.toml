[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe"
version = "0.2.0"
description = "Security evaluation harness for tool-using LLM agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9"]
inspect = ["inspect-ai>=0.3"]

[project.urls]
Homepage = "https://github.com/ayanverse-io/agentprobe"
Issues = "https://github.com/ayanverse-io/agentprobe/issues"

[project.scripts]
agentprobe = "agentprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentprobe = ["corpus/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agentprobe"]
omit = ["*/corpus/*", "*/__main__.py", "*/judge_llm.py", "*/inspect_eval.py"]
