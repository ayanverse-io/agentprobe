name: AgentProbe
description: Fail CI if an LLM agent's attack-success rate exceeds a threshold
inputs:
  agent:
    description: refuse | obey | anthropic | openai | minimal | langgraph
    default: refuse
  fail-above:
    description: Maximum allowed ASR (0–1)
    default: "0"
  category:
    description: Optional corpus category
    default: ""
runs:
  using: composite
  steps:
    - run: pip install "${{ github.action_path }}"
      shell: bash
    - run: |
        extra=""
        if [ -n "${{ inputs.category }}" ]; then extra="--category ${{ inputs.category }}"; fi
        agentprobe run --agent "${{ inputs.agent }}" --fail-above "${{ inputs.fail-above }}" $extra --out reports
      shell: bash
